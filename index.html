<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#0a0e16">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Kash OS — your personal health, recovery, training and progress command center.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kash OS">
  <meta name="format-detection" content="telephone=no">
  <title>Kash OS</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/app/styles.css">
  <script type="module" src="/app/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#app-main">Skip to health overview</a>
  <div class="app-frame" id="app-frame">
    <header class="app-header">
      <div>
        <p class="eyebrow" id="today-label">PERSONAL HEALTH OS</p>
        <h1>KASH<span>•</span></h1>
      </div>
      <div class="header-actions">
        <span class="sync-dot" id="sync-dot" data-state="loading" aria-hidden="true"></span>
        <button class="log-fab" type="button" data-action="open-log" aria-label="Log health data"><span>+</span></button>
        <button class="icon-button" type="button" data-open="settings" aria-label="Open settings">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21H9.6v-.09A1.7 1.7 0 0 0 8.55 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.2 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H2.4V9.6h.09A1.7 1.7 0 0 0 4.2 8.55a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 8.55 4.2a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V2.4h4v.09A1.7 1.7 0 0 0 15 4.2a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 8.55a1.7 1.7 0 0 0 .6 1 1.7 1.7 0 0 0 1.1.4h.09v4h-.09A1.7 1.7 0 0 0 19.4 15Z"/></svg>
        </button>
      </div>
    </header>

    <div class="pull-indicator" id="pull-indicator" aria-live="polite">Pull to refresh</div>

    <main id="app-main" tabindex="-1">
      <section class="screen is-active" data-screen="today" aria-labelledby="today-heading">
        <h2 class="sr-only" id="today-heading">Today</h2>
        <div id="today-content" class="screen-content skeleton-screen" aria-live="polite"></div>
      </section>
      <section class="screen" data-screen="train" aria-labelledby="train-heading" hidden>
        <div class="screen-title"><div><p class="eyebrow">HYROX MUMBAI · 13 AUG → 18 SEP</p><h2 id="train-heading">The Plan</h2></div><span id="train-countdown" class="status-chip">Loading</span></div>
        <div id="train-content" class="screen-content"></div>
      </section>
      <section class="screen" data-screen="progress" aria-labelledby="progress-heading" hidden>
        <div class="screen-title"><div><p class="eyebrow">RECOVERY · BODY · ACTIVITY</p><h2 id="progress-heading">Pulse</h2></div><button class="text-button" type="button" data-action="open-log" data-log-kind="measurement">Add</button></div>
        <div id="progress-content" class="screen-content"></div>
      </section>
      <section class="screen" data-screen="library" aria-labelledby="library-heading" hidden>
        <div class="screen-title"><div><p class="eyebrow">FUEL · DHARMA · BODY · RESEARCH</p><h2 id="library-heading">Life</h2></div></div>
        <label class="search-field"><span class="sr-only">Search library</span><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="library-search" type="search" placeholder="Search plans, nutrition, races…" autocomplete="off"></label>
        <div id="library-content" class="screen-content"></div>
      </section>
      <section class="screen" data-screen="sync" aria-labelledby="sync-heading" hidden>
        <div class="screen-title"><div><p class="eyebrow">YOUR CONNECTED SYSTEM</p><h2 id="sync-heading">Sync</h2></div><button class="text-button" type="button" data-action="refresh-app">Refresh</button></div>
        <div id="sync-content" class="screen-content"></div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <button class="nav-item is-active" type="button" data-route="today" aria-current="page"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10M9 20v-6h6v6"/></svg><span>Today</span></button>
      <button class="nav-item" type="button" data-route="train"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/></svg><span>Plan</span></button>
      <button class="nav-item" type="button" data-route="progress"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 13h4l2-6 4 12 2-6h6"/></svg><span>Pulse</span></button>
      <button class="nav-item" type="button" data-route="library"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 4h6v16H4zM14 4h6v16h-6z"/><path d="M7 8h0M17 8h0"/></svg><span>Life</span></button>
      <button class="nav-item" type="button" data-route="sync"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 7h-9M14 4l-3 3 3 3M4 17h9M10 14l3 3-3 3"/></svg><span>Sync</span></button>
    </nav>
  </div>

  <div class="sheet-layer" id="sheet-layer" hidden>
    <button class="sheet-scrim" type="button" data-action="close-sheet" aria-label="Close"></button>
    <section class="bottom-sheet" id="bottom-sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div id="sheet-content"></div>
    </section>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p class="noscript">Kash OS needs JavaScript to load your synced health data.</p></noscript>
</body>
</html>
